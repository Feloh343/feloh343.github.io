<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Sesiones Fotográficas</title>
  <style>
    :root {
      --primary: #4f46e5;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 24px;
    }

    .form-container {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    button:hover {
      opacity: 0.9;
    }

    .session-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .session-item {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 14px 16px;
      border-radius: 8px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .session-info {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    .session-text {
      font-size: 16px;
      word-break: break-word;
    }

    .paid-badge {
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 12px;
      font-weight: bold;
    }

    .paid {
      background-color: #dcfce7;
      color: #166534;
    }

    .pending {
      background-color: #fef3c7;
      color: #92400e;
    }

    .actions {
      display: flex;
      gap: 6px;
    }

    .btn-action {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      padding: 4px 8px;
      color: #64748b;
    }

    .btn-action:hover {
      color: var(--text);
    }
  </style>
</head>
<body>

  <h1>📷 Sesiones Fotográficas</h1>

  <div class="form-container">
    <input type="text" id="sessionInput" placeholder="Ej: Sesión retrato - María" />
    <button onclick="addSession()">Agregar</button>
  </div>

  <ul class="session-list" id="sessionList"></ul>

  <script>
    let sessions = JSON.parse(localStorage.getItem('photo_sessions')) || [];

    function saveAndRender() {
      localStorage.setItem('photo_sessions', JSON.stringify(sessions));
      renderList();
    }

    function addSession() {
      const input = document.getElementById('sessionInput');
      const title = input.value.trim();
      if (!title) return;

      sessions.push({
        id: Date.now(),
        title: title,
        isPaid: false
      });

      input.value = '';
      saveAndRender();
    }

    function togglePaid(id) {
      sessions = sessions.map(item => 
        item.id === id ? { ...item, isPaid: !item.isPaid } : item
      );
      saveAndRender();
    }

    function editSession(id) {
      const item = sessions.find(s => s.id === id);
      const newTitle = prompt("Editar nombre de la sesión:", item.title);
      if (newTitle !== null && newTitle.trim() !== "") {
        item.title = newTitle.trim();
        saveAndRender();
      }
    }

    function deleteSession(id) {
      if (confirm("¿Seguro que deseas eliminar esta sesión?")) {
        sessions = sessions.filter(s => s.id !== id);
        saveAndRender();
      }
    }

    function renderList() {
      const listContainer = document.getElementById('sessionList');
      listContainer.innerHTML = '';

      sessions.forEach(item => {
        const li = document.createElement('li');
        li.className = 'session-item';
        li.innerHTML = `
          <div class="session-info">
            <input type="checkbox" ${item.isPaid ? 'checked' : ''} onchange="togglePaid(${item.id})">
            <span class="session-text">${item.title}</span>
            <span class="paid-badge ${item.isPaid ? 'paid' : 'pending'}">
              ${item.isPaid ? 'Pagado' : 'Pendiente'}
            </span>
          </div>
          <div class="actions">
            <button class="btn-action" onclick="editSession(${item.id})" title="Editar">✏️</button>
            <button class="btn-action" onclick="deleteSession(${item.id})" title="Eliminar">🗑️</button>
          </div>
        `;
        listContainer.appendChild(li);
      });
    }

    // Render inicial al cargar la página
    renderList();
  </script>
</body>
</html>
