<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard de Sesiones</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --warning: #f59e0b;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 1rem;
      min-height: 100vh;
    }

    #dashboard-content {
      display: none;
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .user-info {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .user-info span {
      color: var(--text-main);
      font-weight: 600;
    }

    .logout-btn {
      padding: 0.5rem 1rem;
      background-color: transparent;
      border: 1px solid var(--danger);
      color: var(--danger);
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }

    .logout-btn:hover {
      background-color: var(--danger);
      color: #fff;
    }

    .actions-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .btn-primary {
      padding: 0.75rem 1.25rem;
      background-color: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }

    @media (min-width: 600px) {
      .btn-primary { width: auto; }
    }

    .btn-primary:hover { background-color: var(--accent-hover); }

    /* Formulario Modal */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(0,0,0,0.7);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 1rem;
      z-index: 100;
    }

    .modal {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal h2 { margin-bottom: 1rem; }

    .form-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 0.4rem;
      color: var(--text-muted);
    }

    input, select, textarea {
      width: 100%;
      padding: 0.65rem;
      background-color: var(--bg-color);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.95rem;
      font-family: inherit;
    }

    textarea {
      resize: vertical;
    }

    .form-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 1.5rem;
    }

    .btn-secondary {
      background-color: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.65rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      width: 50%;
    }

    /* Tabla adaptable */
    .table-container {
      width: 100%;
      overflow-x: auto;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    th, td {
      padding: 0.85rem;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    th {
      background-color: rgba(0,0,0,0.2);
      color: var(--text-muted);
      font-weight: 600;
    }

    .badge {
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: capitalize;
    }
    .badge.por-entregar { background-color: rgba(245, 158, 11, 0.2); color: var(--warning); }
    .badge.entregada { background-color: rgba(16, 185, 129, 0.2); color: var(--success); }
    .badge.cancelada { background-color: rgba(239, 68, 68, 0.2); color: var(--danger); }

    .btn-sm {
      padding: 0.35rem 0.65rem;
      font-size: 0.8rem;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      margin-right: 0.25rem;
    }

    .btn-edit { background-color: #0284c7; color: white; }
    .btn-delete { background-color: var(--danger); color: white; }

    .salary-highlight {
      font-weight: bold;
      color: var(--success);
    }

    .comments-cell {
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div id="dashboard-content">
    <header>
      <div>
        <h1>Gestión de Sesiones</h1>
        <p class="user-info">Usuario: <span id="user-email"></span></p>
      </div>
      <button id="logout-btn" class="logout-btn">Cerrar Sesión</button>
    </header>

    <div class="actions-bar">
      <button id="open-modal-btn" class="btn-primary">+ Nueva Sesión</button>
    </div>

    <!-- Tabla de Sesiones -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Sesión</th>
            <th>Empleado</th>
            <th>Progreso</th>
            <th>Precio Final</th>
            <th>% Ganancia</th>
            <th>Salario Calc.</th>
            <th>Comentarios</th>
            <th>Fecha Límite</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="sessions-table-body">
          <!-- Carga dinámica -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal Formulario -->
  <div id="session-modal" class="modal-backdrop">
    <div class="modal">
      <h2 id="modal-title">Nueva Sesión</h2>
      <form id="session-form">
        <input type="hidden" id="session-id">
        
        <div class="form-group">
          <label for="nombre_sesion">Nombre de la Sesión</label>
          <input type="text" id="nombre_sesion" required placeholder="Ej. Sesión Fotográfica Boda">
        </div>

        <div class="form-group">
          <label for="empleado_id">Empleado Asignado</label>
          <select id="empleado_id" required>
            <option value="">Cargando empleados...</option>
          </select>
        </div>

        <div class="form-group">
          <label for="progreso">Estado de Progreso</label>
          <select id="progreso" required>
            <option value="por entregar">Por Entregar</option>
            <option value="entregada">Entregada</option>
            <option value="cancelada">Cancelada</option>
          </select>
        </div>

        <div class="form-group">
          <label for="porcentaje_ganancia">% Ganancia de Empleado</label>
          <input type="number" id="porcentaje_ganancia" step="0.01" min="0" max="100" required placeholder="Ej. 30">
        </div>

        <div class="form-group">
          <label for="precio_final">Precio Final Sesión Cancelada (Opcional)</label>
          <input type="number" id="precio_final" step="0.01" min="0" placeholder="Ej. 150.00">
        </div>

        <div class="form-group">
          <label for="comentarios">Comentarios (Opcional)</label>
          <textarea id="comentarios" rows="3" placeholder="Notas sobre el estado, acuerdos o detalles..."></textarea>
        </div>

        <div class="form-group">
          <label for="fecha_limite">Fecha Límite</label>
          <!-- Solo calendario (YYYY-MM-DD) -->
          <input type="date" id="fecha_limite" required>
        </div>

        <div class="form-actions">
          <button type="button" id="close-modal-btn" class="btn-secondary">Cancelar</button>
          <button type="submit" class="btn-primary" style="width: 50%;">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { supabase } from './supabase.js';

    let empleadosMap = {}; 

    // 1. Proteger ruta e inicializar
    async function init() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        window.location.replace('index.html');
        return;
      }
      
      document.getElementById('user-email').textContent = session.user.email;
      document.getElementById('dashboard-content').style.display = 'block';

      await loadEmpleados();
      await loadSesiones();
    }

    init();

    // Logout
    document.getElementById('logout-btn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.replace('index.html');
    });

    // 2. Cargar empleados (Tabla de Solo Lectura)
    async function loadEmpleados() {
      const { data, error } = await supabase.from('empleados').select('*');
      if (error) {
        console.error('Error al cargar empleados:', error);
        return;
      }

      const select = document.getElementById('empleado_id');
      select.innerHTML = '<option value="">Selecciona un empleado</option>';

      data.forEach(emp => {
        empleadosMap[emp.id] = emp.nombre;
        const option = document.createElement('option');
        option.value = emp.id;
        option.textContent = emp.nombre;
        select.appendChild(option);
      });
    }

    // 3. Cargar y renderizar sesiones
    async function loadSesiones() {
      const { data: sesiones, error } = await supabase
        .from('sesiones')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Error al obtener sesiones:', error);
        return;
      }

      const tbody = document.getElementById('sessions-table-body');
      tbody.innerHTML = '';

      sesiones.forEach(sesion => {
        const tr = document.createElement('tr');

        // Cálculo del salario cuando aplica (cancelada)
        let salarioCalculado = '$0.00';
        if (sesion.progreso === 'cancelada' && sesion.precio_final) {
          const monto = (parseFloat(sesion.precio_final) * parseFloat(sesion.porcentaje_ganancia)) / 100;
          salarioCalculado = `$${monto.toFixed(2)}`;
        }

        tr.innerHTML = `
          <td><strong>${sesion.nombre_sesion}</strong></td>
          <td>${empleadosMap[sesion.empleado_id] || 'Sin asignar'}</td>
          <td><span class="badge ${sesion.progreso.replace(' ', '-')}">${sesion.progreso}</span></td>
          <td>${sesion.precio_final ? '$' + parseFloat(sesion.precio_final).toFixed(2) : '-'}</td>
          <td>${sesion.porcentaje_ganancia}%</td>
          <td class="salary-highlight">${salarioCalculado}</td>
          <td class="comments-cell" title="${sesion.comentarios || ''}">${sesion.comentarios || '-'}</td>
          <td>${sesion.fecha_limite || '-'}</td>
          <td>
            <button class="btn-sm btn-edit" data-id="${sesion.id}">Editar</button>
            <button class="btn-sm btn-delete" data-id="${sesion.id}">Eliminar</button>
          </td>
        `;

        tbody.appendChild(tr);
      });

      // Eventos editar / eliminar
      document.querySelectorAll('.btn-edit').forEach(b => b.addEventListener('click', (e) => openEditModal(e.target.dataset.id, sesiones)));
      document.querySelectorAll('.btn-delete').forEach(b => b.addEventListener('click', (e) => deleteSesion(e.target.dataset.id)));
    }

    // 4. Guardar / Actualizar Sesión
    const modal = document.getElementById('session-modal');
    const form = document.getElementById('session-form');

    document.getElementById('open-modal-btn').addEventListener('click', () => {
      form.reset();
      document.getElementById('session-id').value = '';
      document.getElementById('modal-title').textContent = 'Nueva Sesión';
      modal.style.display = 'flex';
    });

    document.getElementById('close-modal-btn').addEventListener('click', () => {
      modal.style.display = 'none';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const id = document.getElementById('session-id').value;
      const payload = {
        nombre_sesion: document.getElementById('nombre_sesion').value,
        empleado_id: document.getElementById('empleado_id').value || null,
        progreso: document.getElementById('progreso').value,
        porcentaje_ganancia: parseFloat(document.getElementById('porcentaje_ganancia').value),
        precio_final: document.getElementById('precio_final').value ? parseFloat(document.getElementById('precio_final').value) : null,
        comentarios: document.getElementById('comentarios').value.trim() || null,
        fecha_limite: document.getElementById('fecha_limite').value // Cadena tipo YYYY-MM-DD
      };

      let result;
      if (id) {
        result = await supabase.from('sesiones').update(payload).eq('id', id);
      } else {
        result = await supabase.from('sesiones').insert([payload]);
      }

      if (result.error) {
        alert('Error al guardar: ' + result.error.message);
      } else {
        modal.style.display = 'none';
        await loadSesiones();
      }
    });

    // 5. Cargar datos en el Modal para Edición
    function openEditModal(id, sesiones) {
      const s = sesiones.find(item => item.id === id);
      if (!s) return;

      document.getElementById('session-id').value = s.id;
      document.getElementById('nombre_sesion').value = s.nombre_sesion;
      document.getElementById('empleado_id').value = s.empleado_id || '';
      document.getElementById('progreso').value = s.progreso;
      document.getElementById('porcentaje_ganancia').value = s.porcentaje_ganancia;
      document.getElementById('precio_final').value = s.precio_final || '';
      document.getElementById('comentarios').value = s.comentarios || '';
      document.getElementById('fecha_limite').value = s.fecha_limite || '';

      document.getElementById('modal-title').textContent = 'Editar Sesión';
      modal.style.display = 'flex';
    }

    // 6. Eliminar Sesión
    async function deleteSesion(id) {
      if (confirm('¿Estás seguro de que deseas eliminar esta sesión?')) {
        const { error } = await supabase.from('sesiones').delete().eq('id', id);
        if (error) {
          alert('Error al eliminar: ' + error.message);
        } else {
          await loadSesiones();
        }
      }
    }
  </script>
</body>
</html>
